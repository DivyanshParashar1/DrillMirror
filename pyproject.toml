[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drillmirror"
version = "0.1.0"
description = "Ontology-aligned digital twin for offshore naturally flowing oil wells."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyarrow",
    "joblib",
    "flask",
    "python-dotenv",
    "requests",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
